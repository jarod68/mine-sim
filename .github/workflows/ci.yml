name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking gate: lint + unit tests + coverage thresholds (vitest.config.js).
  # Fully deterministic and platform-independent.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage   # vitest run --coverage, fails if thresholds drop

  # Real gate. Runs inside the official Playwright image (browsers preinstalled)
  # so Chromium font/AA rendering is deterministic and matches the committed
  # *-linux.png baselines. Regenerate those in the SAME image after a UI change:
  #   docker run --rm -v "$PWD":/work -v /work/node_modules -w /work \
  #     mcr.microsoft.com/playwright:v1.61.0-noble \
  #     bash -c "npm ci && npx playwright test --update-snapshots"
  visual:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.0-noble
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm run test:visual

  # Supply-chain gate: build the image locally (amd64, not pushed), generate a
  # CycloneDX SBOM with Syft and scan it with Grype. Fails on any High/Critical
  # CVE that has a fix available (`--only-fixed`); Debian "won't fix" findings
  # are still listed but don't block. Runs before `docker`, so a vulnerable
  # image is never pushed.
  sbom:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mine-sim:scan
          cache-from: type=gha
      - name: Install Syft & Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh  | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate CycloneDX SBOM (Syft)
        # Pin the CycloneDX spec to 1.6 (recent Syft defaults to 1.7) for
        # compatibility with tools that only read up to 1.6.
        run: syft "docker:mine-sim:scan" -o cyclonedx-json@1.6=sbom.cdx.json
      - name: Scan the SBOM (Grype)
        run: grype "sbom:sbom.cdx.json" --fail-on high --only-fixed

  # Build + push the multi-arch image to Docker Hub (the CI equivalent of
  # `npm run build`). Only on a push to main, and only once the `test` and
  # `sbom` gates are green. Requires repo secrets DOCKERHUB_USERNAME and
  # DOCKERHUB_TOKEN (a Docker Hub access token); pushes jarod68/mine-sim:latest.
  docker:
    runs-on: ubuntu-latest
    needs: [test, sbom]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: build   # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN live in this environment
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3        # emulation for the arm64 build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: jarod68/mine-sim:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
