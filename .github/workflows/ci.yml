name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking gate: lint + unit tests + coverage thresholds (vitest.config.js).
  # Fully deterministic and platform-independent.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage   # vitest run --coverage, fails if thresholds drop

  # Real gate. Runs inside the official Playwright image (browsers preinstalled)
  # so Chromium font/AA rendering is deterministic and matches the committed
  # *-linux.png baselines. Regenerate those in the SAME image after a UI change:
  #   docker run --rm -v "$PWD":/work -v /work/node_modules -w /work \
  #     mcr.microsoft.com/playwright:v1.61.0-noble \
  #     bash -c "npm ci && npx playwright test --update-snapshots"
  visual:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.0-noble
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm run test:visual

  # End-to-end smoke tests: real server + real Chromium driven by Robot Framework
  # (Browser library). Deterministic; a real gate.
  robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r test/robot/requirements.txt
      # System libs for Chromium, then the Browser library's own browser binary.
      - run: npx playwright install --with-deps chromium
      - run: rfbrowser init chromium
      - run: npm run test:robot
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: test/robot/results/

  # Build + push the multi-arch image to Docker Hub (the CI equivalent of
  # `npm run build`). Only on a push to main, and only once the blocking `test`
  # gate is green. Requires repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
  # (a Docker Hub access token); pushes jarod68/mine-sim:latest.
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: build   # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN live in this environment
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3        # emulation for the arm64 build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: jarod68/mine-sim:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Software supply-chain: generate a CycloneDX SBOM from the freshly-pushed
  # image with Syft, scan it with Grype (report-only gate), and upload the SBOM
  # to Dependency-Track (https://dtrack.holtz.fr) for continuous SCA. Needs repo
  # secrets DTRACK_URL and DTRACK_API_KEY (an automation-team key with
  # BOM_UPLOAD + PROJECT_CREATION_UPLOAD).
  sbom:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Install Syft & Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh  | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate CycloneDX SBOM (Syft)
        # Pin the CycloneDX spec to 1.6 — recent Syft defaults to 1.7, which
        # Dependency-Track 4.12 rejects with HTTP 400 (it supports up to 1.6).
        run: syft "jarod68/mine-sim:latest" -o cyclonedx-json@1.6=sbom.cdx.json
      - name: Scan the SBOM (Grype)
        # Report-only for now — drop `|| true` to fail the build on a critical CVE.
        run: grype "sbom:sbom.cdx.json" --fail-on critical || true
      - name: Upload SBOM to Dependency-Track
        env:
          DTRACK_URL: ${{ secrets.DTRACK_URL }}
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
          # "user:password" for the Traefik basic-auth guarding dtrack.holtz.fr.
          DTRACK_BASIC_AUTH: ${{ secrets.DTRACK_BASIC_AUTH }}
        run: |
          # If the dtrack host's /api is behind Traefik basic-auth, send those
          # creds too (set DTRACK_BASIC_AUTH); Dependency-Track authenticates the
          # upload itself via X-Api-Key. When /api is open, leave the secret unset.
          auth=()
          [ -n "$DTRACK_BASIC_AUTH" ] && auth=(-u "$DTRACK_BASIC_AUTH")
          # Capture DT's response body — it explains a 400 (bad BOM / spec version).
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST "$DTRACK_URL/api/v1/bom" \
            "${auth[@]}" \
            -H "X-Api-Key: $DTRACK_API_KEY" \
            -F "autoCreate=true" \
            -F "projectName=mine-sim" \
            -F "projectVersion=latest" \
            -F "bom=@sbom.cdx.json")
          echo "HTTP $code"; cat resp.txt; echo
          [ "$code" -lt 300 ] || exit 1
